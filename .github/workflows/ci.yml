name: CI

# Runs on every pull request and on main: lint, type check, tests, production
# build, then Playwright (phone and desktop screenshots) and Lighthouse
# (mobile) against the built site.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, test, build, screenshots, Lighthouse
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      - run: npm test

      - run: npm run build

      - name: Start the built site
        run: |
          npm run start &
          for i in $(seq 1 30); do
            curl --silent --fail --output /dev/null http://localhost:3000 && exit 0
            sleep 1
          done
          echo "The site did not start" && exit 1

      # Playwright is pinned here rather than in package.json, the same way
      # Lighthouse is, so it adds nothing to the site's own install.
      - name: Install Playwright
        run: |
          npm install --no-save @playwright/test@1.63.0
          npx playwright install --with-deps chromium

      - name: Playwright, phone and desktop screenshots
        run: npm run screenshots

      # TEMPORARY: lets Claude look at the screenshots; removed before review.
      - name: Print screenshots
        if: ${{ !cancelled() }}
        run: |
          for f in screenshots/*/*.png; do
            echo "SHOT-BEGIN $f"; base64 -w0 "$f"; echo; echo "SHOT-END $f"
          done

      - name: Upload the screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots/
          if-no-files-found: warn
          retention-days: 14

      - name: Lighthouse, mobile
        run: node scripts/lighthouse-check.mjs http://localhost:3000/
