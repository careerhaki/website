name: Temporary - create package-lock.json

# One-off: the foundation was written where npm could not reach the registry,
# so the lockfile is created here. This file is deleted in the next commit.

on:
  push:
    branches: [feat/foundation]

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --package-lock-only
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Add package-lock.json"
          git push
